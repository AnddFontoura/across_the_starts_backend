services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ats_backend_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ats

  web:
    image: nginx:1.27-alpine
    container_name: ats_backend_web
    ports:
      - "8201:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ats

  db:
    image: mysql:8.0
    container_name: ats_backend_db
    environment:
      MYSQL_DATABASE: across_the_stars
      MYSQL_USER: ats
      MYSQL_PASSWORD: ats_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "8206:3306"
    volumes:
      - ats_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ats

networks:
  ats:
    driver: bridge

volumes:
  ats_db_data:
